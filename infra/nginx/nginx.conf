events {}

http {
  upstream backend_up {
    server backend:8000;
  }

  upstream frontend_up {
    server frontend:80;
  }

  # Autoriser uniquement localhost / 127.0.0.1 pour CORS
  map $http_origin $cors_allow_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$"    $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
  }

  server {
    listen 80;

    # ================== API ==================
    # ^~ force ce bloc à matcher /api/ avant le bloc /
    location ^~ /api/ {

      # --- Preflight CORS ---
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true"             always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age           86400 always;
        return 204;
      }

      # Réponses normales
      add_header Access-Control-Allow-Origin      $cors_allow_origin always;
      add_header Access-Control-Allow-Credentials "true"             always;

      proxy_pass http://backend_up;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================== FRONT ==================
    # Toute autre route (SPA, assets, locales)
    location / {
      proxy_pass http://frontend_up/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
  proxy_pass       http://backend_up/auth/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# fichiers statiques servis par Fastify (/uploads/avatars/…)
location /uploads/ {
  proxy_pass       http://backend_up/uploads/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

  }
}
