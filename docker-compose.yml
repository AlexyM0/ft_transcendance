version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pong-frontend:prod
    # Internal only
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pong-backend:prod
    env_file: ./backend/.env
    # Internal only
    expose:
      - "5000"
    volumes:
      - db_data:/app/db
      - uploads_data:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80" # public HTTP; swap to 443 with TLS if you add certs
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
