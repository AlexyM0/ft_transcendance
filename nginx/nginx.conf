user  nginx;
worker_processes  auto;

events { 
	worker_connections  1024;
 }

http {
  # Basic hardening + sane defaults
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Gzip for text assets (optional but nice)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  # Upstreams (internal Docker DNS names = service names from compose)
  upstream frontend_upstream { 
		server frontend:80; 
	}

  upstream backend_upstream  { 
	server backend:5000; 
  }

  server {
    listen 80; # For HTTPS, terminate TLS here (add certs or a companion like nginx-proxy/letsencrypt)
    server_name _;

    # --- SPA static (served by the frontend container) ---
    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # If you want the reverse-proxy to serve index.html fallback itself, you can instead
      # copy the dist here and use try_files; but proxying keeps containers separate.
    }

    # --- REST API ---
    location /api/ {
      proxy_pass http://backend_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
	  proxy_set_header X-Forwarded-Host $host;   # keep original host for redirects
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 300;
    }

    # --- WebSocket ---
    # Example WS endpoint is /ws; adjust if yours differs
    location /api/ws {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Forwarded-Host $host;  
      proxy_read_timeout 3600;
    }

    # Upload sizes if your avatars or files are large
    client_max_body_size 10m;
  }
}
